        items:
          type: array
          items: { $ref: '#/components/schemas/LigoUser' }
    LigoMessagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LigoMessage' }
