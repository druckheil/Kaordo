      security: [{ bearerAuth: [] }]
      description: Audits and persists host-wide journal retention. Archived journals may be deleted by native rotation and vacuum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [retentionDays, reason]
              properties:
                retentionDays: { type: integer, enum: [0, 1, 7, 14, 30, 90], description: Zero keeps history until the storage budget requires rotation }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { description: Applied journal policy and current host-wide usage, content: { application/json: { schema: { $ref: '#/components/schemas/RegadoJournal' } } } }
