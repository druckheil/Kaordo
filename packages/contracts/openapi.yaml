      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 10, maxLength: 500 }, target: { type: string, maxLength: 1024, description: Device path for configure-storage or mounted Btrfs path for scrub-filesystem/check-storage/repair-storage }, identity: { type: string, maxLength: 256, description: Stable serial or WWN, revalidated by regado-agent before partitioning }, filesystem: { type: string, maxLength: 1024, description: Existing mounted Btrfs data-pool path for configure-storage } } } } }
      responses:
        '202': { description: Audited system operation accepted, content: { application/json: { schema: { $ref: '#/components/schemas/RegadoActionResult' } } } }
        default: { description: Error, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }

