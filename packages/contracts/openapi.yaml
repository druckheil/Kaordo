    LigoMembersRequest:
      type: object
      required: [participantIds]
      properties:
        title: { type: string, maxLength: 524320 }
        expectedTitle: { type: string, maxLength: 524320 }
        participantIds:
          type: array
          items: { type: string, format: uuid }
    RondoServer:
      type: object
      required: [id, name, description, access, ownerId, memberCount, joined, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        access: { type: string, enum: [public, private] }
        ownerId: { type: string, format: uuid }
        memberCount: { type: integer }
        joined: { type: boolean }
        createdAt: { type: string, format: date-time }
    RondoChannel:
      type: object
      required: [id, serverId, conversationId, name, position, createdAt]
      properties:
        id: { type: string, format: uuid }
        serverId: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        createdAt: { type: string, format: date-time }
    RondoDetail:
      type: object
      required: [server, channels, members]
      properties:
        server: { $ref: '#/components/schemas/RondoServer' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/RondoChannel' }
