  /v1/admin/hosts/{host}/operations/{operation}:
    get:
      operationId: getRegadoHostOperation
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RegadoHost'
        - { name: operation, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The operation with its log
          content:
            { application/json: { schema: { $ref: '#/components/schemas/HostOperationRecord' } } }
