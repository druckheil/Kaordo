                properties: { measuring: { type: boolean } }
        default: { $ref: '#/components/responses/RegadoHostError' }
  /v1/admin/hosts/{host}/alerts:
    get:
      operationId: listRegadoHostAlerts
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RegadoHost' }]
      responses:
        '200':
          description: Open alerts by severity, then alerts resolved in the last 30 days
