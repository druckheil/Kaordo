            type: boolean,
            description: Account-owned verification; not editable through profile requests.
          }
    FluoPresence:
      type: string
      enum: [online, busy, offline]
    FluoStatus:
      type: string
      enum: [online, busy, invisible]
    UserPresentation:
      type: object
      required: [id, avatar, presence]
      properties:
        id: { type: string, format: uuid }
        avatar:
          anyOf:
            - { $ref: '#/components/schemas/FluoMedia' }
            - { type: 'null' }
        presence:
          anyOf:
            - { $ref: '#/components/schemas/FluoPresence' }
            - { type: 'null' }
          description: Availability filtered by current privacy and mutual follows; null hides the indicator.
    FluoProfile:
      allOf:
        - { $ref: '#/components/schemas/FluoAuthor' }
        - type: object
          required:
            [
              bio,
              birthDate,
              location,
              website,
              pronouns,
              banner,
              createdAt,
              followersCount,
              followingCount,
              followedBy,
              accountVisibility,
              canViewPosts,
              presence
            ]
          properties:
            bio: { type: string, maxLength: 500 }
            birthDate: { type: [string, 'null'], format: date }
            location: { type: string, maxLength: 100 }
            website: { type: string, maxLength: 300 }
            pronouns: { type: string, maxLength: 40 }
            banner:
              anyOf:
                - { $ref: '#/components/schemas/FluoMedia' }
                - { type: 'null' }
            createdAt: { type: string, format: date-time }
            followersCount: { type: integer, format: int64, minimum: 0 }
            followingCount: { type: integer, format: int64, minimum: 0 }
            followedBy: { type: boolean }
            accountVisibility: { type: string, enum: [public, private] }
            canViewPosts:
              {
                type: boolean,
                description: Current account and follow policy permits this viewer to see public posts.
              }
            presence:
              anyOf:
                - { $ref: '#/components/schemas/FluoPresence' }
                - { type: 'null' }
              description: Null hides availability under the owner's privacy policy or invisible status. Online and busy expire after 7 seconds without an active Kaordo heartbeat.
            status:
              $ref: '#/components/schemas/FluoStatus'
              description: The chosen status, returned only to the profile owner when status visibility is not Nobody.
    FluoProfileUpdate:
      type: object
      additionalProperties: false
      required: [nickname, bio, birthDate, location, website, pronouns, avatarId, bannerId]
      properties:
        nickname: { type: string, minLength: 1, maxLength: 80 }
        bio: { type: string, maxLength: 500 }
        birthDate: { type: [string, 'null'], format: date }
        location: { type: string, maxLength: 100 }
        website:
          {
            type: string,
            maxLength: 300,
            description: An absolute HTTP(S) URL without credentials,
            or an empty string.
          }
        pronouns: { type: string, maxLength: 40 }
        avatarId:
          {
            type: [string, 'null'],
            format: uuid,
            description: Owned,
            completed square image upload; null removes the avatar.
          }
        bannerId:
          {
            type: [string, 'null'],
            format: uuid,
            description: Owned,
            completed 3:1 image upload; null removes the banner.
          }
    FluoConnectionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FluoAuthor' } }
        nextCursor: { type: [string, 'null'] }
    FluoMedia:
      type: object
      required: [id, kind, mimeType, width, height, size, altText, url]
      properties:
        id: { type: string, format: uuid }
        kind:
          {
            type: string,
            enum: [image, video, file],
            description: Stored post attachments are opaque files until the device opens their descriptor
          }
        mimeType: { type: string }
        width: { type: integer }
        height: { type: integer }
        size: { type: integer, format: int64 }
        altText:
          {
            type: string,
            maxLength: 500,
            description: Description for assistive technology,
            scoped to this post.
          }
        url: { type: string, format: uri, description: Short lived signed Nodo URL. }
    FluoQuote:
      type: object
      required: [id, author, text, media]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/FluoAuthor' }
        text: { type: string }
        media:
          type: array
          items: { $ref: '#/components/schemas/FluoMedia' }
    FluoCounts:
      type: object
      required: [good, bad, comments, quotes, saves]
      properties:
        good: { type: integer, format: int64 }
        bad: { type: integer, format: int64 }
        comments: { type: integer, format: int64, description: Number of direct replies. }
        quotes:
          { type: integer, format: int64, description: Number of public posts quoting this post. }
        saves:
          { type: integer, format: int64, description: Number of accounts that saved this post. }
    FluoPost:
      type: object
      required:
        [
          id,
          author,
          content,
          text,
          visibility,
          parentId,
          quoteId,
          quoteDeleted,
          quote,
          media,
          counts,
          myReaction,
          saved,
          createdAt,
          updatedAt
        ]
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/FluoAuthor' }
        content: { $ref: '#/components/schemas/FluoContent' }
        text: { type: string }
        visibility: { type: string, enum: [public, private] }
        parentId:
          {
            type: [string, 'null'],
            format: uuid,
            description: Direct parent post for replies; null for a root post.
          }
        quoteId:
          {
            type: [string, 'null'],
            format: uuid,
            description: ID of the public post or reply quoted by this post.
          }
        quoteDeleted: { type: boolean, description: Whether the quoted post was deleted. }
        quote: { anyOf: [{ $ref: '#/components/schemas/FluoQuote' }, { type: 'null' }] }
        media:
          type: array
          items: { $ref: '#/components/schemas/FluoMedia' }
        counts: { $ref: '#/components/schemas/FluoCounts' }
        myReaction: { type: [string, 'null'], enum: [good, bad, null] }
        saved: { type: boolean, description: Whether the current user saved this post. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FluoPostThread:
      type: object
      required: [posts]
      properties:
        posts:
          type: array
          description: Accessible posts ordered from the thread root through the selected post.
          items: { $ref: '#/components/schemas/FluoPost' }
    FluoPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FluoPost' }
        nextCursor: { type: [string, 'null'] }
    FluoNewPost:
      type: object
      required: [content, visibility]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Device-generated ID bound to the encrypted content signature
          }
        content: { $ref: '#/components/schemas/FluoContent' }
        visibility: { type: string, enum: [public, private] }
        parentId: { type: string, format: uuid }
        quoteId: { type: string, format: uuid }
        attachmentIds:
          type: array
          maxItems: 4
          items: { type: string, format: uuid }
        altTexts:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
          description: Optional descriptions keyed by attached upload ID; stored per post.
    FluoPostVisibility:
      type: object
      required: [visibility]
      properties:
        visibility: { type: string, enum: [public, private] }
        content:
          {
            $ref: '#/components/schemas/FluoEnvelope',
            description: Required when a private post becomes public
          }
    FluoReaction:
      type: object
      required: [value]
      properties:
        value: { type: string, enum: [good, bad] }
    FluoNotificationPolicy:
      type: string
      enum: [all, off, following]
      description: Notify for all actors, nobody, or only accounts the recipient follows at the time of the action.
    FluoNotificationPreferences:
      type: object
      additionalProperties: false
      required: [likes, dislikes, replies, follows, unfollows, quotes]
      properties:
        likes: { $ref: '#/components/schemas/FluoNotificationPolicy', default: all }
        dislikes: { $ref: '#/components/schemas/FluoNotificationPolicy', default: all }
        replies: { $ref: '#/components/schemas/FluoNotificationPolicy', default: all }
        follows: { $ref: '#/components/schemas/FluoNotificationPolicy', default: all }
        unfollows: { $ref: '#/components/schemas/FluoNotificationPolicy', default: off }
        quotes: { $ref: '#/components/schemas/FluoNotificationPolicy', default: all }
    FluoPrivacySettings:
      type: object
      additionalProperties: false
      required: [accountVisibility, showLikes, presenceVisibility]
      properties:
        accountVisibility:
          type: string
          enum: [public, private]
          default: public
          description: Private account posts are accessible only to their author and accounts the author follows. Individual private posts remain author-only.
        showLikes:
          type: boolean
          default: true
          description: Hidden likes still contribute to counts, but do not create identifying notifications. Existing like notifications are hidden while this setting is false.
        presenceVisibility:
          type: string
          enum: [all, friends, off]
          default: all
          description: Availability is visible to everyone, mutual follows only, or nobody. Invisible status always hides it from other accounts.
    FluoSettings:
      type: object
      required: [notifications, privacy]
      properties:
        notifications: { $ref: '#/components/schemas/FluoNotificationPreferences' }
        privacy: { $ref: '#/components/schemas/FluoPrivacySettings' }
    FluoSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        notifications:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            likes: { $ref: '#/components/schemas/FluoNotificationPolicy' }
            dislikes: { $ref: '#/components/schemas/FluoNotificationPolicy' }
            replies: { $ref: '#/components/schemas/FluoNotificationPolicy' }
            follows: { $ref: '#/components/schemas/FluoNotificationPolicy' }
            unfollows: { $ref: '#/components/schemas/FluoNotificationPolicy' }
            quotes: { $ref: '#/components/schemas/FluoNotificationPolicy' }
        privacy:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            accountVisibility: { type: string, enum: [public, private] }
            showLikes: { type: boolean }
            presenceVisibility: { type: string, enum: [all, friends, off] }
    FluoNotification:
      type: object
      description: Activity from another account, visible only to its recipient while its posts remain accessible.
      required: [id, kind, actor, post, createdAt, readAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [like, dislike, reply, quote, follow, unfollow] }
        actor: { $ref: '#/components/schemas/FluoAuthor' }
        post:
          anyOf:
            - type: object
              required: [id, text, media]
              properties:
                id:
                  {
                    type: string,
                    format: uuid,
                    description: Open this post; replies include their ancestor thread and quotes include the quoted post.
                  }
                text: { type: string, maxLength: 280, description: Accessible plain-text preview. }
                media:
                  {
                    type: array,
                    maxItems: 4,
                    items: { $ref: '#/components/schemas/FluoMedia' },
                    description: Destination post attachments for bounded notification previews.
                  }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
        readAt:
          {
            type: [string, 'null'],
            format: date-time,
            description: Server read timestamp; null means unread.
          }
    FluoNotificationSummary:
      type: object
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, format: int64, minimum: 0 }
    FluoNotificationPage:
      type: object
      required: [items, nextCursor, through, unreadCount]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/FluoNotification' } }
        nextCursor: { type: [string, 'null'] }
        through:
          {
            type: [string, 'null'],
            description: Opaque cursor of the newest item on this page; use the first page's boundary to mark existing notifications read.
          }
        unreadCount:
          {
            type: integer,
            format: int64,
            minimum: 0,
            description: Count of all accessible unread notifications in the same snapshot.
          }
    FluoNotificationReadState:
      type: object
      required: [id, readAt, unreadCount]
      properties:
        id: { type: string, format: uuid }
        readAt: { type: string, format: date-time }
        unreadCount: { type: integer, format: int64, minimum: 0 }
    NodoUpload:
      type: object
      required: [id, kind, mimeType, filename, width, height, size, complete]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [image, video, file] }
        mimeType: { type: string }
        filename: { type: string }
        width: { type: integer }
        height: { type: integer }
        size: { type: integer, format: int64 }
        complete: { type: boolean }
    MediaReference:
      type: object
      required: [referenced]
      properties:
        referenced: { type: boolean }
  parameters:
    RegadoHost:
      name: host
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' }
  responses:
    RegadoHostError:
      description: An agent refusal (400, 404, 409, 422) with its operator-facing message, or 503 when the agent is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
paths:
  /v1/fluo/keyring:
    get:
      operationId: getFluoKeyring
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          {
            description: Own audience key versions and followed accounts still waiting for sealed copies,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/FluoKeyringState' } } }
          }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
    post:
      operationId: updateFluoKeyring
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/FluoKeyringUpdate' } } }
      responses:
        '200':
          {
            description: Updated audience key state,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/FluoKeyringState' } } }
          }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/fluo/keys:
    get:
      operationId: getFluoKeys
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: refs,
            in: query,
            required: true,
            description: Comma-separated ownerId:version pairs,
            schema: { type: string, maxLength: 6000 }
          }
      responses:
        '200':
          description: Published keys and sealed copies addressed to the viewer
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/FluoKeyMaterial' } }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/rondo/channels/{id}/voice-key:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      operationId: readRondoVoiceKey
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          {
            description: Membership-bound voice key,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RondoVoiceKey' } } }
          }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
    put:
      operationId: writeRondoVoiceKey
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RondoVoiceKey' } } }
      responses:
        '200':
          {
            description: Committed voice key,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/RondoVoiceKey' } } }
          }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/recovery:
    get:
      operationId: readRecoveryBundle
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sealed recovery bundle or an empty string before setup
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [wrappedKeys],
                      properties: { wrappedKeys: { type: string } }
                    }
                }
            }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
    put:
      operationId: saveRecoveryBundle
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedWrappedKeys, wrappedKeys, signature]
              properties:
                expectedWrappedKeys: { type: string, maxLength: 4096 }
                wrappedKeys: { type: string, maxLength: 4096 }
                signature: { type: string, minLength: 88, maxLength: 88 }
      responses:
        '200':
          {
            description: Recovery bundle saved,
            content:
              {
                application/json:
                  {
                    schema:
                      { type: object, required: [saved], properties: { saved: { type: boolean } } }
                  }
              }
          }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/records/read:
    post:
      operationId: readPrivateRecords
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { type: array, maxItems: 502, items: { type: string } }
      responses:
        '200':
          description: Owned ciphertext records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PrivateRecord' } }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/records/commit:
    post:
      operationId: commitPrivateRecords
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          {
            application/json: { schema: { $ref: '#/components/schemas/PrivateRecordTransaction' } }
          }
      responses:
        '200':
          description: Committed ciphertext records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PrivateRecord' } }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/users/{id}:
    get:
      operationId: publicEncryptionIdentity
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          {
            description: Public encryption identity,
            content:
              {
                application/json:
                  { schema: { $ref: '#/components/schemas/PublicEncryptionIdentity' } }
              }
          }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/audience/{module}/{id}:
    get:
      operationId: encryptionAudience
      security: [{ bearerAuth: [] }]
      parameters:
        - {
            name: module,
            in: path,
            required: true,
            schema: { type: string, enum: [ligo, ligo-history, rondo] }
          }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: private, in: query, schema: { type: boolean } }
      responses:
        '200':
          {
            description: Authorized encryption recipients,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EncryptionAudience' } } }
          }
        default:
          {
            description: API error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/identity:
    get:
      operationId: readEncryptionIdentity
      security: [{ bearerAuth: [] }]
      description: Reads this account's public identity and sealed device keys; private keys never reach Kerno.
      responses:
        '200':
          description: Account identity, or null before its first device
          content:
            application/json:
              schema:
                type: object
                required: [identity]
                properties:
                  identity:
                    anyOf:
                      - { $ref: '#/components/schemas/EncryptionIdentity' }
                      - { type: 'null' }
        default:
          {
            description: Error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/devices:
    post:
      operationId: registerEncryptionDevice
      security: [{ bearerAuth: [] }]
      description: Initializes the first device or registers another device awaiting a signed transfer.
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/EncryptionRegistration' } } }
      responses:
        '200':
          {
            description: Current identity,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EncryptionIdentity' } } }
          }
        default:
          {
            description: Error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/devices/{id}/approve:
    post:
      operationId: approveEncryptionDevice
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      description: Approves a device using account-signed sealed keys; login alone cannot mint an approval.
      requestBody:
        required: true
        content:
          { application/json: { schema: { $ref: '#/components/schemas/EncryptionApproval' } } }
      responses:
        '200':
          {
            description: Current identity,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EncryptionIdentity' } } }
          }
        default:
          {
            description: Error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/crypto/devices/{id}:
    delete:
      operationId: forgetEncryptionDevice
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      description: Removes a device binding using an account signature bound to its current public key and sealed bundle. Does not erase keys already obtained by a device.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signature]
              properties:
                signature: { type: string, minLength: 88, maxLength: 88 }
      responses:
        '200':
          {
            description: Current identity,
            content:
              { application/json: { schema: { $ref: '#/components/schemas/EncryptionIdentity' } } }
          }
        default:
          {
            description: Error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/memoro/month:
    get:
      operationId: readMemoroMonth
      security: [{ bearerAuth: [] }]
      parameters:
        [
          {
            name: tag,
            in: query,
            required: true,
            schema: { type: string, pattern: '^[0-9a-f]{64}$' }
          }
        ]
      responses:
        '200':
          description: Encrypted calendar summaries
          content:
            {
              application/json:
                {
                  schema:
                    {
                      type: object,
                      required: [items],
                      properties:
                        {
                          items:
                            { type: array, items: { $ref: '#/components/schemas/MemoroSummary' } }
                        }
                    }
                }
            }
        default:
          {
            description: Error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
  /v1/memoro/days/{dayTag}:
    parameters:
      [
        {
          name: dayTag,
          in: path,
          required: true,
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        }
      ]
    get:
      operationId: readMemoroDay
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Encrypted day, or null for an empty date
          content:
            application/json:
              schema:
                type: object
                required: [day]
                properties:
                  day:
                    anyOf:
                      - { $ref: '#/components/schemas/MemoroDay' }
                      - { type: 'null' }
        default:
          {
            description: Error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
    put:
      operationId: saveMemoroDay
      security: [{ bearerAuth: [] }]
      description: Saves encrypted content with a revision check and validates encrypted upload ownership.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemoroDayUpdate' } } }
      responses:
        '200':
          {
            description: Saved encrypted day,
            content: { application/json: { schema: { $ref: '#/components/schemas/MemoroDay' } } }
          }
        default:
          {
            description: Error,
            content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
          }
