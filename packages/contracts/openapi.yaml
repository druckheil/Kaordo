          type: array
          items: { $ref: '#/components/schemas/RondoServer' }
    RondoNewServer:
      type: object
      required: [name, description, access]
      properties:
        id: { type: string, format: uuid }
        generalId: { type: string, format: uuid }
        general: { type: string, maxLength: 524320 }
