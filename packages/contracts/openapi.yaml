openapi: 3.1.0
info:
  title: Kaordo API
  version: 0.0.1
servers:
  - url: http://localhost:8081
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token with aud=kerno-api
    internalToken:
      type: apiKey
      in: header
      name: X-Kaordo-Internal-Token
      description: Derived token shared only by the local Kerno and Nodo processes.
  schemas:
    PrivateRecord:
      type: object
      required: [tag, revision, nonce, ciphertext]
      properties:
        tag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 0 }
        nonce: { type: string }
        ciphertext: { type: string, maxLength: 2097152 }
    PrivateRecordTransaction:
      type: object
      required: [writes, deletes]
      properties:
        writes: { type: array, maxItems: 502, items: { $ref: '#/components/schemas/PrivateRecord' } }
        deletes:
          type: array
          maxItems: 502
          items:
            type: object
            required: [tag, revision]
            properties:
              tag: { type: string, pattern: '^[0-9a-f]{64}$' }
              revision: { type: integer, minimum: 1 }
    PublicEncryptionIdentity:
      type: object
      required: [id, encryptionPublicKey, signingPublicKey]
      properties:
        id: { type: string, format: uuid }
        encryptionPublicKey: { type: string, minLength: 44, maxLength: 44 }
        signingPublicKey: { type: string, minLength: 44, maxLength: 44 }
    EncryptionAudience:
      type: object
      required: [public, users]
      properties:
        public: { type: boolean }
        users: { type: array, maxItems: 512, items: { $ref: '#/components/schemas/PublicEncryptionIdentity' } }
    ContentEnvelope:
      type: object
      additionalProperties: false
      required: [version, context, senderId, nonce, ciphertext, keys, publicKey, signature]
      properties:
        version: { type: integer, const: 1 }
        context: { type: string, maxLength: 180 }
        senderId: { type: string, format: uuid }
        nonce: { type: string, minLength: 32, maxLength: 32 }
        ciphertext: { type: string, maxLength: 524288 }
        publicKey: { type: string, maxLength: 44 }
        signature: { type: string, minLength: 88, maxLength: 88 }
        keys:
          type: array
          maxItems: 512
          items:
            type: object
            required: [userId, key]
            properties:
              userId: { type: string, format: uuid }
              key: { type: string, minLength: 108, maxLength: 108 }
    FluoContent:
      oneOf:
        - { $ref: '#/components/schemas/FluoDocument' }
        - { $ref: '#/components/schemas/FluoEnvelope' }
    FluoKeyRef:
      type: object
      additionalProperties: false
      required: [ownerId, version]
      properties:
        ownerId: { type: string, format: uuid }
        version: { type: integer, minimum: 0, description: Version 0 is the author's never-shared self key }
    FluoEnvelope:
      type: object
      additionalProperties: false
      required: [version, context, senderId, nonce, ciphertext, keyring, signature]
      properties:
        version: { type: integer, const: 1 }
        context: { type: string, maxLength: 180 }
        senderId: { type: string, format: uuid }
        nonce: { type: string, minLength: 32, maxLength: 32 }
        ciphertext: { type: string, maxLength: 524288 }
        keyring: { type: array, minItems: 1, maxItems: 64, items: { $ref: '#/components/schemas/FluoKeyRef' } }
        signature: { type: string, minLength: 88, maxLength: 88 }
    FluoKeyringState:
      type: object
      required: [accountVisibility, versions, missing]
      properties:
        accountVisibility: { type: string, enum: [public, private] }
        versions:
          type: array
          items:
            type: object
            required: [version, published]
            properties:
              version: { type: integer, minimum: 1 }
              published: { type: boolean }
        missing:
          type: array
          items:
            type: object
            required: [recipient, versions]
            properties:
              recipient: { $ref: '#/components/schemas/PublicEncryptionIdentity' }
              versions: { type: array, items: { type: integer, minimum: 1 } }
    FluoKeyringUpdate:
      type: object
      required: [create, publish, grants]
      properties:
        create: { type: integer, minimum: 0, description: The next version to create, or 0 }
        publish:
          type: array
          maxItems: 512
          items:
            type: object
            required: [version, key]
            properties:
              version: { type: integer, minimum: 1 }
              key: { type: string, minLength: 44, maxLength: 44 }
        grants:
          type: array
          maxItems: 512
          items:
            type: object
            required: [recipientId, version, sealedKey]
            properties:
              recipientId: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
              sealedKey: { type: string, minLength: 108, maxLength: 108 }
    FluoKeyMaterial:
      type: object
      required: [ownerId, version]
      properties:
        ownerId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        publicKey: { type: string, minLength: 44, maxLength: 44 }
        sealedKey: { type: string, minLength: 108, maxLength: 108 }
    EncryptionDevice:
      type: object
      required: [id, publicKey, wrappedKeys, createdAt]
      properties:
        id: { type: string, format: uuid }
        publicKey: { type: string, minLength: 44, maxLength: 44 }
        wrappedKeys: { type: string, maxLength: 4096 }
        createdAt: { type: string, format: date-time }
    EncryptionIdentity:
      type: object
      required: [encryptionPublicKey, signingPublicKey, devices]
      properties:
        encryptionPublicKey: { type: string, minLength: 44, maxLength: 44 }
        signingPublicKey: { type: string, minLength: 44, maxLength: 44 }
        devices: { type: array, items: { $ref: '#/components/schemas/EncryptionDevice' } }
    EncryptionRegistration:
      type: object
      required: [id, publicKey]
      properties:
        id: { type: string, format: uuid }
        publicKey: { type: string, minLength: 44, maxLength: 44 }
        encryptionPublicKey: { type: string, minLength: 44, maxLength: 44 }
        signingPublicKey: { type: string, minLength: 44, maxLength: 44 }
        wrappedKeys: { type: string, maxLength: 4096 }
    EncryptionApproval:
      type: object
      required: [wrappedKeys, signature]
      properties:
        wrappedKeys: { type: string, maxLength: 4096 }
        signature: { type: string, minLength: 88, maxLength: 88 }
    EncryptedEnvelope:
      type: object
      required: [nonce, ciphertext]
      properties:
        nonce: { type: string, minLength: 16, maxLength: 16 }
        ciphertext: { type: string, minLength: 24, maxLength: 2097152 }
    MemoroSummary:
      type: object
      required: [dayTag, monthTag, revision, nonce, ciphertext]
      properties:
        dayTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        monthTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 1 }
        nonce: { type: string }
        ciphertext: { type: string }
    MemoroDay:
      type: object
      required: [dayTag, monthTag, revision, nonce, ciphertext, media]
      properties:
        dayTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        monthTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 1 }
        nonce: { type: string }
        ciphertext: { type: string }
        media:
          type: array
          items:
            type: object
            required: [id, size, url]
            properties:
              id: { type: string, format: uuid }
              size: { type: integer }
              url: { type: string, format: uri }
    MemoroDayUpdate:
      type: object
      required: [monthTag, revision, nonce, ciphertext, summary, attachmentIds]
      properties:
        monthTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 0 }
        nonce: { type: string }
        ciphertext: { type: string, maxLength: 2097152 }
        summary: { $ref: '#/components/schemas/EncryptedEnvelope' }
        attachmentIds: { type: array, maxItems: 32, items: { type: string, format: uuid } }
    LingvoDictionary:
      type: "object"
      required: ["id","learningLanguage","nativeLanguage","dailyGoal","timeZone","createdAt"]
      properties:
        id:
          type: "string"
          format: "uuid"
        learningLanguage:
          type: "string"
          enum: ["de"]
        nativeLanguage:
          type: "string"
          enum: ["en","ru"]
        dailyGoal:
          type: "integer"
          minimum: 5
          maximum: 200
        timeZone:
          type: "string"
        createdAt:
          type: "string"
          format: "date-time"
    LingvoDictionaryPage:
      type: "object"
      required: ["items"]
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoDictionary"
    LingvoNewDictionary:
      type: "object"
      required: ["learningLanguage","nativeLanguage","timeZone"]
      properties:
        learningLanguage:
          type: "string"
          enum: ["de"]
        nativeLanguage:
          type: "string"
          enum: ["en","ru"]
        timeZone:
          type: "string"
          minLength: 1
          maxLength: 100
    LingvoSettings:
      type: "object"
      required: ["dailyGoal","timeZone"]
      properties:
        dailyGoal:
          type: "integer"
          minimum: 5
          maximum: 200
        timeZone:
          type: "string"
          minLength: 1
          maxLength: 100
    LingvoFolder:
      type: "object"
      required: ["id","dictionaryId","name"]
      properties:
        id:
          type: "string"
          format: "uuid"
        dictionaryId:
          type: "string"
          format: "uuid"
        name:
          type: "string"
          minLength: 1
          maxLength: 60
    LingvoCardContent:
      type: "object"
      required: ["kind","term","translation","partOfSpeech","article","plural","grammar","example","exampleTranslation","notes","folderId","status"]
      properties:
        kind:
          type: "string"
          enum: ["word","phrase"]
        term:
          type: "string"
          minLength: 1
          maxLength: 300
        translation:
          type: "string"
          minLength: 1
          maxLength: 500
        partOfSpeech:
          type: "string"
          enum: ["","noun","verb","adjective","adverb","other"]
        article:
          type: "string"
          enum: ["","der","die","das"]
        plural:
          type: "string"
          maxLength: 100
        grammar:
          type: "string"
          maxLength: 500
        example:
          type: "string"
          maxLength: 500
        exampleTranslation:
          type: "string"
          maxLength: 500
        notes:
          type: "string"
          maxLength: 1000
        folderId:
          type: ["string","null"]
          format: "uuid"
        status:
          type: "string"
          enum: ["active","known","suspended"]
    LingvoSchedule:
      type: "object"
      required: ["due","stability","difficulty","scheduledDays","reps","lapses","state","lastReview","learningSteps"]
      properties:
        due:
          type: "string"
          format: "date-time"
        stability:
          type: "number"
          minimum: 0
        difficulty:
          type: "number"
          minimum: 0
        scheduledDays:
          type: "integer"
          minimum: 0
        reps:
          type: "integer"
          minimum: 0
        lapses:
          type: "integer"
          minimum: 0
        state:
          type: "integer"
          enum: [0,1,2,3]
        lastReview:
          type: ["string","null"]
          format: "date-time"
        learningSteps:
          type: "integer"
          minimum: 0
    LingvoCard:
      allOf:
        - {"$ref":"#/components/schemas/LingvoCardContent"}
        - {"type":"object","required":["id","dictionaryId","sourceKey","schedule","revision","createdAt"],"properties":{"id":{"type":"string","format":"uuid"},"dictionaryId":{"type":"string","format":"uuid"},"sourceKey":{"type":["string","null"]},"schedule":{"$ref":"#/components/schemas/LingvoSchedule"},"revision":{"type":"integer","minimum":1},"createdAt":{"type":"string","format":"date-time"}}}
    LingvoNewCard:
      allOf:
        - {"$ref":"#/components/schemas/LingvoCardContent"}
        - {"type":"object","required":["id"],"properties":{"id":{"type":"string","format":"uuid","description":"Stable client-generated ID for retrying the same create request."}}}
    LingvoCardUpdate:
      allOf:
        - {"$ref":"#/components/schemas/LingvoCardContent"}
        - {"type":"object","required":["revision"],"properties":{"revision":{"type":"integer","minimum":1}}}
    LingvoCardPage:
      type: "object"
      required: ["items","total"]
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoCard"
        total:
          type: "integer"
    LingvoStudyPage:
      type: "object"
      required: ["items"]
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoCard"
    LingvoCounts:
      type: "object"
      required: ["kind","total","due","new","learning","review","known","suspended","nextDue"]
      properties:
        kind:
          type: "string"
          enum: ["word","phrase"]
        total:
          type: "integer"
        due:
          type: "integer"
        new:
          type: "integer"
        learning:
          type: "integer"
        review:
          type: "integer"
        known:
          type: "integer"
        suspended:
          type: "integer"
        nextDue:
          type: ["string","null"]
          format: "date-time"
    LingvoActivity:
      type: "object"
      required: ["day","reviews"]
      properties:
        day:
          type: "string"
          format: "date"
        reviews:
          type: "integer"
    LingvoOverview:
      type: "object"
      required: ["dictionary","counts","folders","activity","studiedToday","totalReviews","streak","today"]
      properties:
        dictionary:
          $ref: "#/components/schemas/LingvoDictionary"
        counts:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoCounts"
        folders:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoFolder"
        activity:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoActivity"
        studiedToday:
          type: "integer"
        totalReviews:
          type: "integer"
        streak:
          type: "integer"
        today:
          type: "string"
          format: "date"
    LingvoReview:
      type: "object"
      required: ["id","revision","rating","direction"]
      properties:
        id:
          type: "string"
          format: "uuid"
        revision:
          type: "integer"
          minimum: 1
        rating:
          type: "integer"
          enum: [1,2,3,4]
        direction:
          type: "string"
          enum: ["recognition","recall","listening","phrase"]
    LingvoReviewResult:
      type: "object"
      required: ["id","card"]
      properties:
        id:
          type: "string"
          format: "uuid"
        card:
          $ref: "#/components/schemas/LingvoCard"
    LingvoImport:
      type: "object"
      properties:
        setId:
          type: "string"
          maxLength: 100
        cardKeys:
          type: "array"
          minItems: 1
          maxItems: 500
          items:
            type: "string"
            maxLength: 100
        cards:
          type: "array"
          maxItems: 500
          items:
            $ref: "#/components/schemas/LingvoCardContent"
        folderId:
          type: ["string","null"]
          format: "uuid"
        status:
          type: "string"
          enum: ["active","known"]
          description: "Status for catalog cards. Personal cards use their individual status fields."
      description: "Supply either a starter set ID (optionally with selected card keys) or up to 500 personal cards. Existing imported cards are preserved."
    LingvoImportResult:
      type: "object"
      required: ["added","skipped"]
      properties:
        added:
          type: "integer"
        skipped:
          type: "integer"
    LingvoCatalogCard:
      allOf:
        - {"$ref":"#/components/schemas/LingvoCardContent"}
        - {"type":"object","required":["id"],"properties":{"id":{"type":"string"}}}
    LingvoCatalogSet:
      type: "object"
      required: ["id","title","description","kind","level","cards"]
      properties:
        id:
          type: "string"
        title:
          type: "string"
        description:
          type: "string"
        kind:
          type: "string"
          enum: ["word","phrase"]
        level:
          type: "string"
        cards:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoCatalogCard"
    LingvoCatalog:
      type: "object"
      required: ["items"]
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/LingvoCatalogSet"
    UserIdentity:
      type: object
      required: [id, username, displayName, createdAt, isAdmin]
      properties:
        id:
          type: string
          format: uuid
          description: Kaordo UUIDv7; distinct from the Keycloak subject.
        username:
          type: string
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time
        isAdmin:
          type: boolean
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
          description: A stable, non-sensitive reason when an authentication request is rejected.
    RegadoSummary:
      type: object
      required: [users, posts, messages, uploads, mediaBytes, databaseBytes, mediaByKind]
      properties:
        users: { type: integer }
        posts: { type: integer }
        messages: { type: integer }
        uploads: { type: integer }
        mediaBytes: { type: integer }
        databaseBytes: { type: integer }
        mediaByKind:
          type: array
          items:
            type: object
            required: [kind, objects, bytes]
            properties:
              kind: { type: string }
              objects: { type: integer }
              bytes: { type: integer }
    RegadoUser:
      type: object
      required: [id, username, displayName, isAdmin, disabledAt, postCount, messageCount, mediaBytes, lastActivity, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        isAdmin: { type: boolean }
        disabledAt: { type: [string, 'null'], format: date-time }
        postCount: { type: integer }
        messageCount: { type: integer }
        mediaBytes: { type: integer }
        lastActivity: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    RegadoAuditEntry:
      type: object
      required: [id, actor, target, action, reason, detail, createdAt]
      properties:
        id: { type: string, format: uuid }
        actor: { type: string }
        target: { type: [string, 'null'] }
        action: { type: string }
        reason: { type: string }
        detail: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    RegadoDisk:
      type: object
      required: [name, path, label, partitionLabel, fsType, size, type, model, serial, wwn, mountpoints, systemDisk]
      properties:
        name: { type: string }
        path: { type: string }
        label: { type: [string, 'null'] }
        partitionLabel: { type: [string, 'null'] }
        fsType: { type: [string, 'null'] }
        size: { type: integer }
        type: { type: string }
        model: { type: [string, 'null'] }
        serial: { type: [string, 'null'] }
        wwn: { type: [string, 'null'] }
        mountpoints: { type: array, items: { type: [string, 'null'] } }
        systemDisk: { type: boolean, description: Whether this device contains the filesystem mounted at / }
        storageState: { type: string, enum: [unconfigured, queued, working], description: Operational state of this physical device in the managed storage pool }
        configureEligible: { type: boolean, description: Whether the host agent's current preflight considers this device safe to onboard }
        configureReason: { type: string, description: A concise explanation of the current storage state or onboarding eligibility }
        transport: { type: [string, 'null'], description: Discovered physical connection such as SATA, USB, NVMe or iSCSI }
        address: { type: [string, 'null'], description: Discovered controller address; no enclosure bay is inferred }
        partitionType: { type: [string, 'null'] }
        start: { type: integer }
        number: { type: integer }
        role: { type: string, enum: ['', system, storage, unassigned] }
        bootKind: { type: string }
        overheadBytes: { type: integer, description: Partition-table and alignment slack excluded from allocatable regions }
        layoutAvailable: { type: boolean }
        unallocated:
          type: array
          items:
            type: object
            required: [start, size]
            properties:
              start: { type: integer, description: Byte offset from the start of the physical disk }
              size: { type: integer }
        children: { type: array, items: { $ref: '#/components/schemas/RegadoDisk' } }
        health: { $ref: '#/components/schemas/RegadoDiskHealth' }
    RegadoDiskHealth:
      type: object
      required: [state, passed, temperatureC, powerOnHours, reallocatedSectors, pendingSectors, uncorrectableSectors, checkedAt]
      properties:
        state: { type: string, enum: [passed, warning, failed, unavailable, standby] }
        passed: { type: [boolean, 'null'] }
        temperatureC: { type: [integer, 'null'] }
        powerOnHours: { type: [integer, 'null'] }
        reallocatedSectors: { type: [integer, 'null'] }
        pendingSectors: { type: [integer, 'null'] }
        uncorrectableSectors: { type: [integer, 'null'] }
        checkedAt: { type: string, format: date-time }
    RegadoMount:
      type: object
      required: [path, source, fsType, total, used, free, available, integrity]
      properties:
        path: { type: string }
        source: { type: string }
        fsType: { type: string }
        total: { type: integer }
        used: { type: integer }
        free: { type: integer }
        available: { type: boolean }
        integrity: { oneOf: [{ $ref: '#/components/schemas/RegadoFilesystemIntegrity' }, { type: 'null' }] }
    RegadoFilesystemIntegrity:
      type: object
      required: [uuid, members, dataProfile, metadataProfile, systemProfile, mirroredPercent, deviceErrors, devicesOnline, devicesExpected, healthy, balanceRunning, scrubState, scrubErrors]
      properties:
        uuid: { type: string }
        members: { type: array, items: { type: string }, description: Physical block device paths participating in this Btrfs filesystem }
        dataProfile: { type: string }
        metadataProfile: { type: string }
        systemProfile: { type: string }
        mirroredPercent: { type: integer }
        deviceErrors: { type: integer }
        devicesOnline: { type: integer }
        devicesExpected: { type: integer }
        healthy: { type: boolean }
        balanceRunning: { type: boolean }
        scrubState: { type: string, enum: [not-run, running, complete, errors, unknown] }
        scrubErrors: { type: integer }
        physicalTotal: { type: integer, description: Sum of physical pool capacity before RAID replication }
        physicalUsed: { type: integer, description: Physical space used including replicas and metadata }
    RegadoReplicationReport:
      type: object
      required: [path, state, stage, startedAt, checkedAt, files, bytes, unreadable, duplication, checksumState, error]
      properties:
        path: { type: string }
        state: { type: string, enum: [checking, repairing, complete, failed] }
        stage: { type: string, enum: [replication, checksums, inventory, complete] }
        startedAt: { type: [string, 'null'], format: date-time }
        checkedAt: { type: [string, 'null'], format: date-time }
        files: { type: integer }
        bytes: { type: integer, description: Logical size of regular files, not physical block usage }
        unreadable: { type: integer }
        duplication: { type: string, enum: ['', duplicated, single, unverified] }
        progress: { oneOf: [{ $ref: '#/components/schemas/RegadoOperationProgress' }, { type: 'null' }] }
        checksumState: { type: string, enum: ['', passed, errors] }
        error: { type: string }
    RegadoOperationProgress:
      type: object
      required: [completed, total, unit]
      properties:
        completed: { type: integer, minimum: 0 }
        total: { type: [integer, 'null'], minimum: 0, description: Null when no measured denominator is available }
        unit: { type: string, enum: [bytes, chunks, files, uploads, steps] }
    RegadoLayoutRequest:
      type: object
      required: [device, identity, filesystem, systemBytes, storageBytes]
      properties:
        device: { type: string, maxLength: 256 }
        identity: { type: string, maxLength: 256 }
        filesystem: { type: string, maxLength: 1024 }
        systemBytes: { type: integer, minimum: 0 }
        storageBytes: { type: integer, minimum: 0 }
        fingerprint: { type: string, maxLength: 64 }
        confirmation: { type: string, maxLength: 256 }
    RegadoLayoutStep:
      type: object
      required: [kind, role, number, start, size, previousSize, source]
      properties:
        kind: { type: string, enum: [keep, boot, create, resize, activate] }
        role: { type: string, enum: [system, storage] }
        number: { type: integer }
        start: { type: integer }
        size: { type: integer }
        previousSize: { type: integer }
        source: { type: string }
    RegadoStoragePlan:
      type: object
