  /v1/admin/actions/{action}:
    post:
      operationId: runRegadoAction
      description: Restarts run through regado-agent; media actions audit or clean stored uploads in Nodo.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [restart-nodo, restart-livekit, restart-ddclient, check-media, clean-media]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason:
                  {
                    type: string,
                    maxLength: 500,
                    description: Optional reason recorded in the audit
                  }
      responses:
        '202':
          description: Audited system operation accepted
          content:
            application/json: { schema: { $ref: '#/components/schemas/RegadoActionResult' } }
        default:
          description: Error
          content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

  /v1/admin/hosts:
    get:
      operationId: listRegadoHosts
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Registered hosts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { type: object, required: [id], properties: { id: { type: string } } }
        default: { $ref: '#/components/responses/RegadoHostError' }

  /v1/admin/hosts/{host}:
    get:
      operationId: getRegadoHost
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RegadoHost' }]
      responses:
        '200':
          description: Devices, pool, desired state and the steps needed to converge
          content: { application/json: { schema: { $ref: '#/components/schemas/HostFacts' } } }
        default: { $ref: '#/components/responses/RegadoHostError' }

  /v1/admin/hosts/{host}/state/plan:
    post:
      operationId: planRegadoHostState
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RegadoHost' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostState' } } }
      responses:
        '200':
          description: Steps the document would start, and issues that block it
          content: { application/json: { schema: { $ref: '#/components/schemas/HostPoolPlan' } } }
        default: { $ref: '#/components/responses/RegadoHostError' }

  /v1/admin/hosts/{host}/state:
    put:
      operationId: applyRegadoHostState
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RegadoHost' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostStateChange' } } }
      responses:
        '200':
          description: The stored revision and the operation converging the host
          content:
            { application/json: { schema: { $ref: '#/components/schemas/HostStateChangeResult' } } }
        default: { $ref: '#/components/responses/RegadoHostError' }

  /v1/admin/hosts/{host}/operations:
    get:
      operationId: listRegadoHostOperations
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RegadoHost'
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        '200':
          description: Newest operations first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/HostOperation' } }
        default: { $ref: '#/components/responses/RegadoHostError' }
    post:
      operationId: startRegadoHostCheck
      description: Runs an integrity check outside its schedule; one check runs at a time.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/RegadoHost' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/HostCheckRequest' } } }
      responses:
        '200':
          description: The started operation
          content: { application/json: { schema: { $ref: '#/components/schemas/HostOperation' } } }
        default: { $ref: '#/components/responses/RegadoHostError' }

  /v1/admin/hosts/{host}/usage:
    get:
      operationId: getRegadoHostUsage
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/RegadoHost'
        - name: window
          in: query
          required: true
          schema: { type: string, enum: [1d, 7d, 30d, 90d] }
      responses:
        '200':
          description: What fills the host's storage, measured hourly, with its history in the window
          content: { application/json: { schema: { $ref: '#/components/schemas/HostUsage' } } }
        default: { $ref: '#/components/responses/RegadoHostError' }
  /v1/admin/hosts/{host}/usage/measure:
    post:
      operationId: measureRegadoHostUsage
