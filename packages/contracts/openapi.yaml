openapi: 3.1.0
info:
  title: Kaordo API
  version: 0.0.1
servers:
  - url: http://localhost:8081
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token with aud=kerno-api
    internalToken:
      type: apiKey
      in: header
      name: X-Kaordo-Internal-Token
      description: Derived token shared only by the local Kerno and Nodo processes.
  schemas:
    HostIdentity:
      type: object
      required: [name, machineId, firmware, poolMount]
      properties:
        name: { type: string }
        machineId: { type: string }
        firmware: { type: string, enum: [bios, efi] }
        poolMount: { type: string }
    HostPartition:
      type: object
      required: [path, number, size, label, type, fsType, fsLabel, fsUuid, mountpoints]
      properties:
        path: { type: string }
        number: { type: integer }
        size: { type: integer }
        label: { type: string }
        type: { type: string }
        fsType: { type: string }
        fsLabel: { type: string }
        fsUuid: { type: string }
        mountpoints: { type: array, items: { type: string } }
    HostDevice:
      type: object
      required:
        [
          id,
          path,
          model,
          serial,
          wwn,
          size,
          rotational,
          transport,
          fsType,
          fsLabel,
          fsUuid,
          mountpoints,
          partitions,
          class,
          hostsSystem,
          health
        ]
      properties:
        id:
          { type: string, description: Stable /dev/disk/by-id name; empty when the device has none }
        path: { type: string }
        model: { type: string }
        serial: { type: string }
        wwn: { type: string }
        size: { type: integer }
        rotational: { type: boolean }
        transport: { type: string }
        fsType: { type: string }
        fsLabel: { type: string }
        fsUuid: { type: string }
        mountpoints: { type: array, items: { type: string } }
        partitions: { type: array, items: { $ref: '#/components/schemas/HostPartition' } }
        class: { type: string, enum: [pool, backup, blank, foreign, unidentified] }
        hostsSystem: { type: boolean }
        health:
          oneOf:
            - { $ref: '#/components/schemas/HostDeviceHealth' }
            - { type: 'null', description: No SMART read has finished yet }
    HostDeviceHealth:
      type: object
      required:
        [
          state,
          passed,
          temperatureC,
          powerOnHours,
          reallocatedSectors,
          pendingSectors,
          uncorrectableSectors,
          checkedAt
        ]
      properties:
        state: { type: string, enum: [passed, warning, failed, unavailable, standby] }
        passed: { type: [boolean, 'null'] }
        temperatureC: { type: [integer, 'null'] }
        powerOnHours: { type: [integer, 'null'] }
        reallocatedSectors: { type: [integer, 'null'] }
        pendingSectors: { type: [integer, 'null'] }
        uncorrectableSectors: { type: [integer, 'null'] }
        checkedAt: { type: string, format: date-time }
    HostDeviceErrors:
      type: object
      required: [write, read, flush, corruption, generation]
      properties:
        write: { type: integer }
        read: { type: integer }
        flush: { type: integer }
        corruption: { type: integer }
        generation: { type: integer }
    HostPoolMember:
      type: object
      required: [devid, size, used, path, deviceId, missing, errors]
      properties:
        devid: { type: integer }
        size: { type: integer }
        used: { type: integer }
        path: { type: string }
        deviceId: { type: string }
        missing: { type: boolean }
        errors: { $ref: '#/components/schemas/HostDeviceErrors' }
    HostPool:
      type: object
      required:
        [
          uuid,
          label,
          mount,
          members,
          dataProfiles,
          metadataProfiles,
          systemProfiles,
          deviceSize,
          allocated,
          used,
          freeEstimated,
          dataRatio,
          metadataUsed
        ]
      properties:
        uuid: { type: string }
        label: { type: string }
        mount: { type: string }
        members: { type: array, items: { $ref: '#/components/schemas/HostPoolMember' } }
        dataProfiles: { type: array, items: { type: string } }
        metadataProfiles: { type: array, items: { type: string } }
        systemProfiles: { type: array, items: { type: string } }
        deviceSize: { type: integer }
        allocated: { type: integer }
        used: { type: integer }
        freeEstimated: { type: integer }
        dataRatio: { type: number }
        metadataUsed:
          {
            type: integer,
            description: One copy of the filesystem's metadata,
            including inline small files
          }
    HostSnapshotPolicy:
      type: object
      required: [schedule, keepHourly, keepDaily, keepWeekly, keepMonthly]
      properties:
        schedule: { type: string, enum: ['off', hourly, daily] }
        keepHourly: { type: integer, minimum: 0, maximum: 1000 }
        keepDaily: { type: integer, minimum: 0, maximum: 1000 }
        keepWeekly: { type: integer, minimum: 0, maximum: 1000 }
        keepMonthly: { type: integer, minimum: 0, maximum: 1000 }
    HostBackupTarget:
      type: object
      required: [id, kind, device]
      properties:
        id: { type: string }
        kind: { type: string, enum: [disk] }
        device: { type: string }
    HostBackupPolicy:
      type: object
      required: [volume, target, schedule, keepDaily, keepWeekly, keepMonthly]
      properties:
        volume: { type: string }
        target: { type: string }
        schedule: { type: string, enum: [hourly, daily, weekly] }
        keepDaily: { type: integer, minimum: 0 }
        keepWeekly: { type: integer, minimum: 0 }
        keepMonthly: { type: integer, minimum: 0 }
    HostNtfyChannel:
      type: object
      required: [url, topic]
      properties:
        url: { type: string }
        topic: { type: string }
    HostState:
      type: object
      description: The host's desired state document; the agent validates it and assigns revisions
      required: [revision, pool, volumes, snapshots, integrity, backups, cleanup, alerts]
      properties:
        revision: { type: integer, minimum: 0 }
        pool:
          type: object
          required: [devices, dataProfile, metadataProfile]
          properties:
            devices: { type: array, minItems: 1, maxItems: 64, items: { type: string } }
            dataProfile: { type: string, enum: [single, raid1, raid1c3] }
            metadataProfile: { type: string, enum: [auto, single, dup, raid1, raid1c3] }
        volumes:
          type: object
          additionalProperties:
            type: object
            required: [quotaBytes]
            properties:
              quotaBytes: { type: [integer, 'null'] }
        snapshots:
          type: object
          additionalProperties: { $ref: '#/components/schemas/HostSnapshotPolicy' }
        integrity:
          type: object
          required: [scrub, smartShort, smartLong]
          properties:
            scrub: { type: string, enum: ['off', weekly, monthly] }
            smartShort: { type: string, enum: ['off', weekly, monthly] }
            smartLong: { type: string, enum: ['off', weekly, monthly] }
        backups:
          type: object
          required: [targets, policies]
          properties:
            targets: { type: array, items: { $ref: '#/components/schemas/HostBackupTarget' } }
            policies: { type: array, items: { $ref: '#/components/schemas/HostBackupPolicy' } }
        cleanup:
          type: object
          required: [nixGenerationsDays, releasesKeep, journalDays]
          properties:
            nixGenerationsDays: { type: integer, minimum: 0, maximum: 3650 }
            releasesKeep: { type: integer, minimum: 2, maximum: 50 }
            journalDays: { type: integer, enum: [0, 1, 7, 14, 30, 90] }
        alerts:
          type: object
          required: [poolWarningPercent, poolCriticalPercent, ntfy]
          properties:
            poolWarningPercent: { type: integer, minimum: 50, maximum: 98 }
            poolCriticalPercent: { type: integer, minimum: 51, maximum: 99 }
            ntfy:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/HostNtfyChannel'
    HostPoolStep:
      type: object
      required: [kind, summary]
      properties:
        kind: { type: string, enum: [replace, add, convert, remove] }
        device: { type: string }
        replaces: { type: integer }
        data: { type: string }
        metadata: { type: string }
        summary: { type: string }
        confirm:
          { type: string, description: Serial the operator must type before the device is erased }
    HostPoolPlan:
      type: object
      required: [steps, issues]
      properties:
        steps: { type: array, items: { $ref: '#/components/schemas/HostPoolStep' } }
        issues: { type: array, items: { type: string } }
    HostFacts:
      type: object
      required: [host, devices, pool, desired, drift]
      properties:
        host: { $ref: '#/components/schemas/HostIdentity' }
        devices: { type: array, items: { $ref: '#/components/schemas/HostDevice' } }
        pool: { $ref: '#/components/schemas/HostPool' }
        desired: { $ref: '#/components/schemas/HostState' }
        drift: { $ref: '#/components/schemas/HostPoolPlan' }
    HostOperationState:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, interrupted, skipped]
    HostOperationStage:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { $ref: '#/components/schemas/HostOperationState' }
        progress:
          type: object
          required: [done, total, unit]
          properties:
            done: { type: integer }
            total: { type: integer, description: Zero when the size is unknown }
            unit: { type: string }
        detail: { type: string }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    HostOperation:
      type: object
      required: [id, kind, requestedBy, state, cancellable, stages, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string }
        target: { type: string }
        reason: { type: string }
        requestedBy:
          {
            type: string,
            description: 'Account ID, schedule for scheduled checks, or agent for convergence the agent starts itself'
          }
        state: { $ref: '#/components/schemas/HostOperationState' }
        cancellable: { type: boolean }
        stages: { type: array, items: { $ref: '#/components/schemas/HostOperationStage' } }
        error: { type: string }
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
    HostOperationLogEntry:
      type: object
      required: [at, message]
      properties:
        at: { type: string, format: date-time }
        message: { type: string }
    HostOperationRecord:
      allOf:
        - $ref: '#/components/schemas/HostOperation'
        - type: object
          required: [log]
          properties:
            log: { type: array, items: { $ref: '#/components/schemas/HostOperationLogEntry' } }
    HostAlert:
      type: object
      required: [key, severity, summary, firstSeen, lastSeen]
      properties:
        key: { type: string, description: Stable while the problem lasts }
        severity: { type: string, enum: [warning, critical] }
        summary: { type: string }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    HostAlertTest:
      type: object
      required: [ligo, ntfy]
      properties:
        ligo: { type: boolean }
        ntfy: { type: string, description: 'sent, not configured, or failed: <reason>' }
    HostUsageCategory:
      type: object
      required: [key, bytes, files, growthDay, growthWeek]
      properties:
        key:
          type: string
          enum:
            [
              system,
              nix,
              logs,
              database,
              media,
              metrics,
              releases,
              deployment,
              temporary,
              other,
              metadata,
              unreferenced
            ]
        bytes:
          type: integer
          description: Logical file sizes; metadata is reported by the filesystem, unreferenced is the positive remainder of stored pool usage after subtracting file sizes and metadata, without determining its cause
        files: { type: integer }
        growthDay:
          { type: [integer, 'null'], description: Change since the measurement a day earlier }
        growthWeek:
          { type: [integer, 'null'], description: Change since the measurement a week earlier }
    HostUsageSample:
      type: object
      required: [at, stored, bytes]
      properties:
        at: { type: string, format: date-time }
        stored: { type: integer }
        bytes: { type: object, additionalProperties: { type: integer } }
    HostUsage:
      type: object
      required: [measuredAt, measuring, pool, categories, history, fullInDays]
      properties:
        measuredAt: { type: [string, 'null'], format: date-time }
        measuring: { type: boolean }
        pool:
          type: object
          required: [stored, free, saved]
          description: One copy of each stored byte, after compression, and the space still free
          properties:
            stored: { type: integer }
            free: { type: integer }
            saved:
              type: integer
              description: Positive difference between counted file sizes plus filesystem metadata and stored pool usage; an estimate rather than a measurement of compression or shared extents
        categories: { type: array, items: { $ref: '#/components/schemas/HostUsageCategory' } }
        history: { type: array, items: { $ref: '#/components/schemas/HostUsageSample' } }
        fullInDays:
          type: [number, 'null']
          description: The last week's growth projected onto the free space; null when nothing grows
    RegadoAppBytes:
      type: object
      required: [posts, messages, channels, profile, journal, learning]
      properties:
        posts: { type: integer }
        messages: { type: integer }
        channels: { type: integer }
        profile: { type: integer }
        journal: { type: integer }
        learning: { type: integer }
    RegadoUserData:
      type: object
      required: [id, username, displayName, media, records, total, addedWeek]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        media: { $ref: '#/components/schemas/RegadoAppBytes' }
        records: { $ref: '#/components/schemas/RegadoAppBytes' }
        total: { type: integer }
        addedWeek: { type: integer }
    RegadoDataUsage:
      type: object
      required: [users, databases, tables, referencedMedia, referencedUploads]
      properties:
        users: { type: array, items: { $ref: '#/components/schemas/RegadoUserData' } }
        databases:
          type: array
          items:
            type: object
            required: [name, bytes]
            properties: { name: { type: string }, bytes: { type: integer } }
        tables:
          type: array
          items:
            type: object
            required: [name, bytes, rows, deadRows]
            properties:
              name: { type: string }
              bytes: { type: integer }
              rows: { type: integer }
              deadRows: { type: integer }
        referencedMedia: { type: integer }
        referencedUploads: { type: integer }
    HostCheckRequest:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [integrity.scrub, integrity.smart-short, integrity.smart-long] }
        reason: { type: string, maxLength: 500, description: Optional reason recorded in the audit }
    HostStateChange:
      type: object
      required: [document, confirmations]
      properties:
        document: { $ref: '#/components/schemas/HostState' }
        confirmations: { type: array, maxItems: 64, items: { type: string, maxLength: 128 } }
        reason: { type: string, maxLength: 500, description: Optional reason recorded in the audit }
        converge:
          {
            type: boolean,
            description: Start pool steps even when the pool section is unchanged; other settings never touch disks
          }
    HostStateChangeResult:
      type: object
      required: [document, previous, operation]
      properties:
        document: { $ref: '#/components/schemas/HostState' }
        previous:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/HostState'
        operation:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/HostOperation'
    PrivateRecord:
      type: object
      required: [tag, revision, nonce, ciphertext]
      properties:
        tag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 0 }
        nonce: { type: string }
        ciphertext: { type: string, maxLength: 2097152 }
    PrivateRecordTransaction:
      type: object
      required: [writes, deletes]
      properties:
        writes:
          { type: array, maxItems: 502, items: { $ref: '#/components/schemas/PrivateRecord' } }
        deletes:
          type: array
          maxItems: 502
          items:
            type: object
            required: [tag, revision]
            properties:
              tag: { type: string, pattern: '^[0-9a-f]{64}$' }
              revision: { type: integer, minimum: 1 }
    PublicEncryptionIdentity:
      type: object
      required: [id, encryptionPublicKey, signingPublicKey]
      properties:
        id: { type: string, format: uuid }
        encryptionPublicKey: { type: string, minLength: 44, maxLength: 44 }
        signingPublicKey: { type: string, minLength: 44, maxLength: 44 }
    EncryptionAudience:
      type: object
      required: [public, users]
      properties:
        public: { type: boolean }
        users:
          {
            type: array,
            maxItems: 512,
            items: { $ref: '#/components/schemas/PublicEncryptionIdentity' }
          }
    ContentEnvelope:
      type: object
      additionalProperties: false
      required: [version, context, senderId, nonce, ciphertext, keys, publicKey, signature]
      properties:
        version: { type: integer, const: 1 }
        context: { type: string, maxLength: 180 }
        senderId: { type: string, format: uuid }
        nonce: { type: string, minLength: 32, maxLength: 32 }
        ciphertext: { type: string, maxLength: 524288 }
        publicKey: { type: string, maxLength: 44 }
        signature: { type: string, minLength: 88, maxLength: 88 }
        keys:
          type: array
          maxItems: 512
          items:
            type: object
            required: [userId, key]
            properties:
              userId: { type: string, format: uuid }
              key: { type: string, minLength: 108, maxLength: 108 }
    FluoContent:
      oneOf:
        - { $ref: '#/components/schemas/FluoDocument' }
        - { $ref: '#/components/schemas/FluoEnvelope' }
    FluoKeyRef:
      type: object
      additionalProperties: false
      required: [ownerId, version]
      properties:
        ownerId: { type: string, format: uuid }
        version:
          {
            type: integer,
            minimum: 0,
            description: Version 0 is the author's never-shared self key
          }
    FluoEnvelope:
      type: object
      additionalProperties: false
      required: [version, context, senderId, nonce, ciphertext, keyring, signature]
      properties:
        version: { type: integer, const: 1 }
        context: { type: string, maxLength: 180 }
        senderId: { type: string, format: uuid }
        nonce: { type: string, minLength: 32, maxLength: 32 }
        ciphertext: { type: string, maxLength: 524288 }
        keyring:
          {
            type: array,
            minItems: 1,
            maxItems: 64,
            items: { $ref: '#/components/schemas/FluoKeyRef' }
          }
        signature: { type: string, minLength: 88, maxLength: 88 }
    FluoKeyringState:
      type: object
      required: [accountVisibility, versions, missing]
      properties:
        accountVisibility: { type: string, enum: [public, private] }
        versions:
          type: array
          items:
            type: object
            required: [version, published]
            properties:
              version: { type: integer, minimum: 1 }
              published: { type: boolean }
        missing:
          type: array
          items:
            type: object
            required: [recipient, versions]
            properties:
              recipient: { $ref: '#/components/schemas/PublicEncryptionIdentity' }
              versions: { type: array, items: { type: integer, minimum: 1 } }
    FluoKeyringUpdate:
      type: object
      required: [create, publish, grants]
      properties:
        create: { type: integer, minimum: 0, description: The next version to create, or 0 }
        publish:
          type: array
          maxItems: 512
          items:
            type: object
            required: [version, key]
            properties:
              version: { type: integer, minimum: 1 }
              key: { type: string, minLength: 44, maxLength: 44 }
        grants:
          type: array
          maxItems: 512
          items:
            type: object
            required: [recipientId, version, sealedKey]
            properties:
              recipientId: { type: string, format: uuid }
              version: { type: integer, minimum: 1 }
              sealedKey: { type: string, minLength: 108, maxLength: 108 }
    FluoKeyMaterial:
      type: object
      required: [ownerId, version]
      properties:
        ownerId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        publicKey: { type: string, minLength: 44, maxLength: 44 }
        sealedKey: { type: string, minLength: 108, maxLength: 108 }
    EncryptionDevice:
      type: object
      required: [id, publicKey, wrappedKeys, createdAt]
      properties:
        id: { type: string, format: uuid }
        publicKey: { type: string, minLength: 44, maxLength: 44 }
        wrappedKeys: { type: string, maxLength: 4096 }
        createdAt: { type: string, format: date-time }
    EncryptionIdentity:
      type: object
      required: [encryptionPublicKey, signingPublicKey, devices]
      properties:
        encryptionPublicKey: { type: string, minLength: 44, maxLength: 44 }
        signingPublicKey: { type: string, minLength: 44, maxLength: 44 }
        devices: { type: array, items: { $ref: '#/components/schemas/EncryptionDevice' } }
    EncryptionRegistration:
      type: object
      required: [id, publicKey]
      properties:
        id: { type: string, format: uuid }
        publicKey: { type: string, minLength: 44, maxLength: 44 }
        encryptionPublicKey: { type: string, minLength: 44, maxLength: 44 }
        signingPublicKey: { type: string, minLength: 44, maxLength: 44 }
        wrappedKeys: { type: string, maxLength: 4096 }
    EncryptionApproval:
      type: object
      required: [wrappedKeys, signature]
      properties:
        wrappedKeys: { type: string, maxLength: 4096 }
        signature: { type: string, minLength: 88, maxLength: 88 }
    EncryptedEnvelope:
      type: object
      required: [nonce, ciphertext]
      properties:
        nonce: { type: string, minLength: 16, maxLength: 16 }
        ciphertext: { type: string, minLength: 24, maxLength: 2097152 }
    MemoroSummary:
      type: object
      required: [dayTag, monthTag, revision, nonce, ciphertext]
      properties:
        dayTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        monthTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 1 }
        nonce: { type: string }
        ciphertext: { type: string }
    MemoroDay:
      type: object
      required: [dayTag, monthTag, revision, nonce, ciphertext, media]
      properties:
        dayTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        monthTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 1 }
        nonce: { type: string }
        ciphertext: { type: string }
        media:
          type: array
          items:
            type: object
            required: [id, size, url]
            properties:
              id: { type: string, format: uuid }
              size: { type: integer }
              url: { type: string, format: uri }
    MemoroDayUpdate:
      type: object
      required: [monthTag, revision, nonce, ciphertext, summary, attachmentIds]
      properties:
        monthTag: { type: string, pattern: '^[0-9a-f]{64}$' }
        revision: { type: integer, minimum: 0 }
        nonce: { type: string }
        ciphertext: { type: string, maxLength: 2097152 }
        summary: { $ref: '#/components/schemas/EncryptedEnvelope' }
        attachmentIds: { type: array, maxItems: 32, items: { type: string, format: uuid } }
    LingvoDictionary:
      type: 'object'
      required: ['id', 'learningLanguage', 'nativeLanguage', 'dailyGoal', 'timeZone', 'createdAt']
      properties:
        id:
          type: 'string'
          format: 'uuid'
        learningLanguage:
          type: 'string'
          enum: ['de']
        nativeLanguage:
          type: 'string'
          enum: ['en', 'ru']
        dailyGoal:
          type: 'integer'
          minimum: 5
          maximum: 200
        timeZone:
          type: 'string'
        createdAt:
          type: 'string'
          format: 'date-time'
    LingvoDictionaryPage:
      type: 'object'
      required: ['items']
      properties:
        items:
          type: 'array'
          items:
            $ref: '#/components/schemas/LingvoDictionary'
    LingvoNewDictionary:
      type: 'object'
      required: ['learningLanguage', 'nativeLanguage', 'timeZone']
      properties:
        learningLanguage:
          type: 'string'
          enum: ['de']
        nativeLanguage:
          type: 'string'
          enum: ['en', 'ru']
        timeZone:
          type: 'string'
          minLength: 1
          maxLength: 100
    LingvoSettings:
      type: 'object'
      required: ['dailyGoal', 'timeZone']
      properties:
        dailyGoal:
          type: 'integer'
          minimum: 5
          maximum: 200
        timeZone:
          type: 'string'
          minLength: 1
          maxLength: 100
