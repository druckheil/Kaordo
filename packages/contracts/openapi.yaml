        startedAt: { type: [string, 'null'], format: date-time }
        checkedAt: { type: [string, 'null'], format: date-time }
        files: { type: integer }
        bytes: { type: integer }
        surplusFiles: { type: integer, description: Actual expired upload artifact files with no database references }
        surplusBytes: { type: integer }
        unverifiedFiles: { type: integer }
        missingFiles: { type: integer }
        removedFiles: { type: integer }
        removedBytes: { type: integer }
        error: { type: string }
        stage: { type: string, enum: ['', inventory, references, complete] }
        progress: { oneOf: [{ $ref: '#/components/schemas/RegadoOperationProgress' }, { type: 'null' }] }
    RegadoSwapDevice:
      type: object
      required: [name, path, kind, size, used, priority]
