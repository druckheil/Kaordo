# Lints the four Go modules with correctness, security and complexity checks; gofmt and goimports own formatting
version: '2'
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocognit
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
  settings:
    errcheck:
      # Idiomatic best-effort cleanup: rollback after commit, response bodies and temporary paths
      exclude-functions:
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - (io.ReadCloser).Close
        - (net.Listener).Close
        - (*database/sql.DB).Close
        - os.Remove
        - os.RemoveAll
        - (*os.Root).Remove
    gocognit:
      min-complexity: 20
    revive:
      enable-default-rules: true
      rules:
        # Internal application packages document files and packages, not every exported name
        - name: exported
          disabled: true
        - name: context-as-argument
          arguments:
            - allowTypesBefore: '*testing.T'
  exclusions:
    rules:
      # Tests serve no external requests and read as scenarios; their unchecked errors still fail errcheck
      - path: _test\.go
        linters: [gocognit, gosec, noctx]
      # Pending module refactors; remove each entry when its module is reworked.
      # Regado agent: user-facing messages travel in error text instead of typed errors.
      - path: agent/(partition_plan|partition_apply)\.go
        text: (error-strings|ST1005)
      # Functions above the cognitive complexity limit, split during their module pass.
      - linters: [gocognit]
        text: func `(readDiskLayouts|assignPartitionRoles|layoutPoolPreflight|activateRoleArea|planExistingDevice|validatedRepartSteps|countPoolFilesMeasured|collectMounts)`
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
