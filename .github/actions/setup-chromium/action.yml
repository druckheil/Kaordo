# Installs pinned Playwright Chromium with signed packages from the official Ubuntu archive
name: Set up Chromium
description: Prepare Chromium and system libraries without the unreliable Azure package mirror
runs:
  using: composite
  steps:
    - name: Select the official Ubuntu package archive
      shell: bash
      run: sudo bash scripts/ci-ubuntu-mirror.sh
    - name: Install Chromium and its system dependencies
      shell: bash
      run: pnpm exec playwright install --with-deps chromium --only-shell
