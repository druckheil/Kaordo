name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 installers
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kaordo/client check
      - run: pnpm --filter @kaordo/client exec tauri build --bundles nsis,msi
      - name: Collect stable artifact names
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          $nsis = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          $msi = Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $nsis -or -not $msi) { throw "Tauri did not produce both Windows installers." }
          Copy-Item $nsis.FullName release/Kaordo_1.0.0_windows_x64-setup.exe
          Copy-Item $msi.FullName release/Kaordo_1.0.0_windows_x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: kaordo-windows-v1.0.0
          path: release/*
          if-no-files-found: error
          retention-days: 30
