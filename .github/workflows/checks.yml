name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/kerno/go.sum
            services/nodo/go.sum
      - name: Check frontend and generated API contract
        run: |
          pnpm check:front
          pnpm --filter @kaordo/contracts generate
          git diff --exit-code -- packages/contracts/src/openapi.d.ts
      - name: Test browser-independent code and static Pages artifact
        run: |
          pnpm test:auth
          pnpm test:backup
          pnpm test:dependencies
          pnpm test:dev
          pnpm test:pages
      - name: Check Go services
        run: |
          go test -race ./services/kerno/... ./services/nodo/... ./services/mediaauth/...
          go vet ./services/kerno/... ./services/nodo/... ./services/mediaauth/...
          go build ./services/kerno/... ./services/nodo/... ./services/mediaauth/...
      - name: Check Go dependency vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: services/kerno
      - name: Check Nodo dependency vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: services/nodo
      - name: Check media authorization dependency vulnerabilities
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
        working-directory: services/mediaauth
      - name: Test Fluo PostgreSQL integration
        run: |
          cat > deploy/local/.env <<EOF
          KAORDO_DB_PASSWORD=$(openssl rand -hex 24)
          KEYCLOAK_DB_PASSWORD=$(openssl rand -hex 24)
          KEYCLOAK_ADMIN_USERNAME=admin
          KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 24)
          KAORDO_SITE_ORIGIN=http://localhost:8765
          NODO_MEDIA_SIGNING_KEY=$(openssl rand -hex 32)
          EOF
          chmod 600 deploy/local/.env
          docker compose --env-file deploy/local/.env -f deploy/local/compose.yaml up -d --wait app-db
          pnpm test:fluo:db
      - name: Reject npm advisories
        run: pnpm audit --audit-level=low
