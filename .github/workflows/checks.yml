# Runs independent validation layers against one commit and one static app artifact
name: Checks

on:
  push:
    branches: [main, 'scope-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'

jobs:
  frontend:
    name: Frontend and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@479c3cd2084b8e20207344a47dc10bdabea95adb # v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Check frontend and generated API contract
        run: |
          pnpm check:front
          pnpm --filter @kaordo/contracts generate
          git diff --exit-code -- packages/contracts/src/openapi.d.ts
      # Typed lint reads the tsconfig files generated by svelte-kit sync during check:front
      - name: Check formatting, lint and unused code
        run: |
          pnpm format:check
          pnpm lint
          pnpm knip
      - name: Test browser-independent behavior and deployment safeguards
        run: pnpm test:unit

  pages:
    name: Static app artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VITE_KAORDO_AUTH_URL: http://localhost:8080
      VITE_KAORDO_AUTH_REALM: kaordo
      VITE_KAORDO_AUTH_CLIENT_ID: kaordo-web
      VITE_KAORDO_API_URL: http://localhost:8081
      VITE_KAORDO_NODO_URL: http://127.0.0.1:8082
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@479c3cd2084b8e20207344a47dc10bdabea95adb # v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - name: Build and verify all static applications once
        run: pnpm test:pages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: static-apps
          path: dist/pages/
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser fixtures and accessibility (${{ matrix.shard }}/2)
    needs: [frontend, pages]
    runs-on: ubuntu-24.04
    # Include fresh Chromium installation and leave time to upload failure diagnostics
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@479c3cd2084b8e20207344a47dc10bdabea95adb # v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: static-apps
          path: dist/pages/
      - name: Install Chromium and its system dependencies
        uses: ./.github/actions/setup-chromium
      - name: Check isolated product interactions and public screens
        timeout-minutes: 5
        # Test-level sharding runs on separate machines; each owns one Vite-generating worker
        run: pnpm test:ui --fully-parallel --workers=1 --shard=${{ matrix.shard }}/2
      - name: Keep failure traces, screenshots and the HTML report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-failure-${{ matrix.shard }}
          path: dist/test-results/
          retention-days: 3
          if-no-files-found: ignore

  services:
    name: Go services and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: kaordo
          POSTGRES_USER: kaordo
          POSTGRES_PASSWORD: ci-disposable-database
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaordo -d kaordo"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/kerno/go.sum
            services/nodo/go.sum
            services/mediaauth/go.sum
            services/regado-agent/go.sum
      - name: Check all Go modules
        run: |
          go test -race ./services/kerno/... ./services/nodo/... ./services/mediaauth/... ./services/regado-agent/...
          go vet ./services/kerno/... ./services/nodo/... ./services/mediaauth/... ./services/regado-agent/...
          go build ./services/kerno/... ./services/nodo/... ./services/mediaauth/... ./services/regado-agent/...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          install-only: true
      - name: Lint Go modules
        run: |
          for module in kerno nodo mediaauth regado-agent; do
            (cd "services/$module" && golangci-lint run --build-tags hosttest --config ../../.golangci.yml ./...)
          done
      - name: Test host operations on loop devices with real storage tools
        run: node scripts/host-test.mjs
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/checks.yml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test disposable PostgreSQL migrations and product access boundaries
        run: node scripts/product-db.integration.mjs
        env:
          KAORDO_TEST_DB_CONTAINER: ${{ job.services.postgres.id }}
          KAORDO_DB_PASSWORD: ci-disposable-database

  integration:
    name: Identity, product and recovery journeys
    needs: [frontend, pages]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@479c3cd2084b8e20207344a47dc10bdabea95adb # v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/kerno/go.sum
            services/nodo/go.sum
            services/mediaauth/go.sum
            services/regado-agent/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: static-apps
          path: dist/pages/
      - name: Install Chromium and its system dependencies
        uses: ./.github/actions/setup-chromium
      - name: Install restic for the backup journey
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2 \
            --output "$RUNNER_TEMP/restic.bz2"
          echo "f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c  $RUNNER_TEMP/restic.bz2" | sha256sum --check
          bzip2 --decompress "$RUNNER_TEMP/restic.bz2"
          sudo install -m 0755 "$RUNNER_TEMP/restic" /usr/local/bin/restic
      - name: Run every live journey against the built apps
        run: pnpm test:integration
      - name: Stop local services and remove disposable CI volumes
        if: always()
        run: |
          pnpm dev:stop
          if [ -f deploy/local/.env ]; then
            docker compose --env-file deploy/local/.env -f deploy/local/compose.yaml down --volumes
          fi

  security:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@479c3cd2084b8e20207344a47dc10bdabea95adb # v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.work
          cache-dependency-path: |
            services/kerno/go.sum
            services/nodo/go.sum
            services/mediaauth/go.sum
            services/regado-agent/go.sum
      - name: Reject npm advisories
        run: pnpm audit --audit-level=low
      - name: Check vulnerabilities in every Go module
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          for module in kerno nodo mediaauth regado-agent; do
            (cd "services/$module" && govulncheck ./...)
          done

  checks:
    name: checks
    needs: [frontend, pages, browser, services, integration, security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every validation layer to pass
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['CHECK_RESULTS'])
          for name, job in results.items():
              print(f"{name}: {job['result']}")
          if not all(job['result'] == 'success' for job in results.values()):
              raise SystemExit('Every validation layer must pass; skipped or cancelled jobs are not success.')
          PY
